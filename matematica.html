<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matemática • Missão Nota 10</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f2f5ff;color:#24304a}main{max-width:850px;margin:auto;padding:20px}header,.card{background:#fff;border-radius:22px;padding:22px;margin-bottom:16px;box-shadow:0 10px 30px #33447718}header{color:#fff;background:linear-gradient(135deg,#315f99,#7157c8)}a{color:inherit}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#ffffff22;padding:8px 12px;border-radius:99px}.bar{height:12px;background:#e5e9f3;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#7157c8}.opt{display:block;border:2px solid #dde3ef;border-radius:14px;padding:13px;margin:9px 0;cursor:pointer}.opt:hover{border-color:#7157c8}button{border:0;border-radius:13px;padding:12px 16px;font-weight:700;cursor:pointer}.primary{background:#7157c8;color:#fff}.help{background:#edf0ff;color:#41368f}.good{background:#e9f8ef;color:#176b43;padding:12px;border-radius:12px}.bad{background:#fff0f0;color:#96302e;padding:12px;border-radius:12px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.hide{display:none}#result{text-align:center}@media(max-width:600px){header h1{font-size:28px}}</style></head><body><main><header><a href="index.html">← Portal</a><h1>🎯 Desafio de Matemática</h1><p>25 questões • prêmio máximo R$ 5,00</p><div class="stats"><span class="pill" id="pos">Questão 1/25</span><span class="pill" id="money">R$ 0,00</span><span class="pill" id="xp">0 XP</span></div></header><section class="card" id="game"><div class="bar"><i id="prog" style="width:0"></i></div><h2 id="question"></h2><div id="options"></div><div class="row"><button class="help" onclick="hint()">🤖 Assistente</button><button class="help" onclick="students()">🎓 Universitários</button><button class="help" onclick="cards()">🃏 Eliminar 2</button></div><p id="note"></p><div class="row"><button class="primary" id="confirm" onclick="check()">Confirmar</button><button class="primary hide" id="next" onclick="next()">Próxima</button></div></section><section class="card hide" id="result"><h1>🏆 Missão concluída!</h1><h2 id="final"></h2><p id="msg"></p><button class="primary" onclick="restart()">Jogar novamente</button></section></main><script>const Q=[["Sofia tinha 128 figurinhas e ganhou 47. Quantas tem agora?",["165","175","185","195"],1,"128 + 47 = 175."],["Uma biblioteca recebeu 236 livros pela manhã e 159 à tarde. Total?",["385","395","405","415"],1,"236 + 159 = 395."],["Quanto é 347 + 286?",["623","633","643","653"],1,"347 + 286 = 633."],["A escola arrecadou 425 kg e depois 378 kg. Total?",["793","803","813","823"],1,"425 + 378 = 803."],["Há 512 alunos de manhã e 489 à tarde. Total?",["991","1.001","1.011","1.101"],1,"512 + 489 = 1.001."],["Uma loja tinha 450 brinquedos e vendeu 127. Quantos sobraram?",["313","323","333","343"],1,"450 − 127 = 323."],["Quanto é 900 − 468?",["422","432","442","452"],1,"900 − 468 = 432."],["Duda leu 185 páginas de um livro de 320. Quantas faltam?",["125","135","145","155"],1,"320 − 185 = 135."],["Um estádio tem 1.000 lugares e 764 ocupados. Quantos livres?",["226","236","246","256"],1,"1.000 − 764 = 236."],["A fazenda colheu 875 caixas e enviou 398. Quantas ficaram?",["467","477","487","497"],1,"875 − 398 = 477."],["Há 8 caixas com 7 lápis cada. Quantos lápis?",["54","56","58","64"],1,"8 × 7 = 56."],["Uma sala tem 6 filas com 9 cadeiras. Total?",["45","54","56","64"],1,"6 × 9 = 54."],["Quanto é 12 × 4?",["36","44","48","52"],2,"12 × 4 = 48."],["15 pacotes têm 6 canetas cada. Quantas canetas?",["80","85","90","95"],2,"15 × 6 = 90."],["9 vans levam 8 passageiros cada. Total?",["63","72","81","88"],1,"9 × 8 = 72."],["No gráfico: Azul 12, Verde 18, Rosa 9, Amarelo 15. Qual maior?",["Azul","Verde","Rosa","Amarelo"],1,"Verde tem 18."],["No mesmo gráfico, diferença entre Verde e Rosa?",["7","8","9","10"],2,"18 − 9 = 9."],["Tabela de livros: Ana 6, Bia 9, Caio 5, Duda 8. Quem leu mais?",["Ana","Bia","Caio","Duda"],1,"Bia leu 9."],["Na tabela, quantos livros Ana e Duda leram juntas?",["12","13","14","15"],2,"6 + 8 = 14."],["Vendas: Seg 20, Ter 25, Qua 18, Qui 30. Dia de maior venda?",["Segunda","Terça","Quarta","Quinta"],3,"Quinta teve 30."],["Diferença entre quinta e quarta?",["10","11","12","13"],2,"30 − 18 = 12."],["Frutas vendidas: maçã 24, banana 32, laranja 16. Total?",["62","72","82","92"],1,"24 + 32 + 16 = 72."],["Uma caixa tem 5 fileiras de 12 bombons. Total?",["50","55","60","65"],2,"5 × 12 = 60."],["Uma escola comprou 700 cadernos e distribuiu 458. Restaram?",["232","242","252","262"],1,"700 − 458 = 242."],["Equipes: A 12, B 20, C 15, D 10. Diferença entre B e D?",["8","10","12","15"],1,"20 − 10 = 10."]],K='missao-mat-v1';let s=JSON.parse(localStorage.getItem(K)||'null')||{i:0,score:0,ans:[],done:false};let chosen=null,locked=false;const $=x=>document.getElementById(x),brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function save(){localStorage.setItem(K,JSON.stringify(s))}function render(){let q=Q[s.i];$('pos').textContent=`Questão ${s.i+1}/25`;$('money').textContent=brl(s.score/25*5);$('xp').textContent=s.score*20+' XP';$('prog').style.width=(s.i/25*100)+'%';$('question').textContent=q[0];$('options').innerHTML=q[1].map((o,i)=>`<label class="opt"><input type="radio" name="o" value="${i}"> ${String.fromCharCode(65+i)}. ${o}</label>`).join('');$('note').className='';$('note').textContent='';$('confirm').classList.remove('hide');$('next').classList.add('hide');chosen=null;locked=false}function check(){if(locked)return;let e=document.querySelector('input[name=o]:checked');if(!e){$('note').className='bad';$('note').textContent='Escolha uma alternativa.';return}chosen=+e.value;locked=true;let q=Q[s.i],ok=chosen===q[2];if(ok)s.score++;s.ans[s.i]=ok;$('note').className=ok?'good':'bad';$('note').innerHTML=(ok?'🎉 Acertou! ':'💡 Quase! ')+q[3];$('confirm').classList.add('hide');$('next').classList.remove('hide');save()}function next(){if(s.i<24){s.i++;save();render()}else{s.done=true;save();finish()}}function finish(){$('game').classList.add('hide');$('result').classList.remove('hide');$('final').textContent=`${s.score} de 25 • ${brl(s.score/25*5)}`;$('msg').textContent=s.score>=20?'Excelente! Você está muito bem preparada.':s.score>=15?'Bom trabalho! Revise os erros e tente novamente.':'Continue treinando. Cada tentativa ajuda a aprender.'}function hint(){let t=s.i<5?'Procure “ao todo” ou “juntou”: use adição.':s.i<10?'Procure “sobrou”, “faltou” ou “diferença”: use subtração.':s.i<15?'Há grupos iguais: use multiplicação.':'Leia os valores com calma e veja se a pergunta pede maior, total ou diferença.';$('note').className='good';$('note').textContent='🤖 '+t}function students(){let c=Q[s.i][2],v=[8,12,15,10];v[c]=70;$('note').className='good';$('note').textContent='🎓 Votação: '+v.map((x,i)=>String.fromCharCode(65+i)+' '+x+'%').join(' • ')}function cards(){let c=Q[s.i][2],w=[0,1,2,3].filter(i=>i!==c).slice(0,2);w.forEach(i=>{let e=document.querySelector(`input[value="${i}"]`);e.disabled=true;e.closest('label').style.opacity=.35});$('note').className='good';$('note').textContent='🃏 Duas alternativas incorretas foram eliminadas.'}function restart(){localStorage.removeItem(K);location.reload()}if(s.done)finish();else render();</script></body></html>
