<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/v2.css"><title>Missão • Missão Nota 10</title><style>.opt{display:block;width:100%;text-align:left;padding:13px 15px;margin:9px 0;border:1px solid var(--line);border-radius:14px;background:#fff;font:inherit;cursor:pointer}.opt:hover{transform:translateY(-1px)}.feedback{padding:14px;border-radius:15px;background:#f4f2ff;margin:14px 0}.study-note{padding:14px;border-radius:16px;background:#f7f7ff;margin:10px 0;line-height:1.5}.videos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.videos iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:15px}.hidden{display:none!important}.question{font-size:1.22rem;font-weight:850;line-height:1.45}.reward{text-align:center;padding:26px}.reward .big{font-size:52px}@media(max-width:760px){.videos{grid-template-columns:1fr}}</style></head><body><main class="shell"><header class="topbar"><a class="brand" id="back" href="index-v3.html">← Missão Nota 10</a><nav class="nav"><a href="index-v3.html#calendario">Calendário</a><button id="soundBtn">🔊 Sons</button></nav></header><section class="mission-hero"><span class="badge" id="subject"></span><h1 id="title">Carregando missão...</h1><p id="desc"></p><div class="stepbar"><div class="step-pill active">📚 Estudar</div><div class="step-pill">✍️ Treinar</div><div class="step-pill">🎯 10 questões</div><div class="step-pill">🏆 Resultado</div></div></section><section class="section card" id="study"><div class="section-title"><div><h2>📚 Revisão</h2><p>Revise antes do desafio ou avance quando se sentir preparada.</p></div><button class="btn soft" id="speak">🔈 Ouvir</button></div><div id="notes"></div><h2>🎥 3 videoaulas</h2><div class="videos" id="videos"></div><p><button class="btn green" id="toTraining">Fazer treino guiado</button> <button class="btn soft" id="skipTraining">Ir direto às 10 questões</button></p></section><section class="section card hidden" id="training"><h2>✍️ Treino guiado</h2><p class="small" id="tCount"></p><p class="question" id="tQuestion"></p><div id="tOptions"></div><div class="feedback hidden" id="tFeedback"></div><button class="btn hidden" id="tNext">Próxima</button></section><section class="section card hidden" id="quiz"><div class="progress"><i id="bar" style="width:10%"></i></div><p class="small" id="qCount"></p><p class="question" id="qQuestion"></p><div id="qOptions"></div><div class="feedback hidden" id="qFeedback"></div><button class="btn hidden" id="qNext">Próxima</button></section><section class="section card reward hidden" id="result"><div class="big">🏆</div><h1 id="score"></h1><p id="message"></p><h2 id="rewards"></h2><a class="btn green" id="mapLink">Voltar às 5 missões</a></section></main><script>const p=new URLSearchParams(location.search),s=p.get('s')||'mat03',m=Math.max(1,Math.min(5,Number(p.get('m')||1))),script=document.createElement('script');script.src='assets/'+s+'-data.js';script.onload=init;script.onerror=()=>document.getElementById('title').textContent='Conteúdo indisponível';document.head.appendChild(script);let sound=localStorage.getItem('missao-som')!=='off';const $=id=>document.getElementById(id);function tone(ok=true){if(!sound)return;try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=ok?760:230;g.gain.setValueAtTime(.05,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.16);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.16)}catch(e){}}function setStage(id){['study','training','quiz','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id));scrollTo({top:0,behavior:'smooth'})}function buttons(el,q,cb){el.innerHTML=q.o.map((x,j)=>'<button class="opt" data-i="'+j+'">'+String.fromCharCode(65+j)+') '+x+'</button>').join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>cb(Number(b.dataset.i),b))}function init(){const root=window.MISSION50_DATA,D=root.missions[m-1];document.title=D.t+' • Missão Nota 10';$('subject').textContent=root.icon+' '+root.subject+' • MISSÃO '+m+'/5';$('title').textContent=D.t;$('desc').textContent=D.d;$('back').href=root.map;$('mapLink').href=root.map;$('notes').innerHTML=D.notes.map(n=>'<div class="study-note">'+n+'</div>').join('');$('videos').innerHTML=root.videos.map(v=>'<iframe src="https://www.youtube-nocookie.com/embed/'+v+'?rel=0&modestbranding=1" title="Videoaula" allowfullscreen></iframe>').join('');$('speak').onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(D.speech||D.notes.join('. '));u.lang='pt-BR';speechSynthesis.speak(u)};let ti=0,qi=0,hits=0;$('toTraining').onclick=()=>{setStage('training');showT()};$('skipTraining').onclick=()=>{setStage('quiz');showQ()};function showT(){let q=D.training[ti];$('tCount').textContent='Treino '+(ti+1)+' de '+D.training.length;$('tQuestion').textContent=q.q;$('tFeedback').classList.add('hidden');$('tNext').classList.add('hidden');buttons($('tOptions'),q,(j)=>{let ok=j===q.a;tone(ok);$('tOptions').querySelectorAll('button').forEach(b=>b.disabled=true);$('tFeedback').textContent=(ok?'✅ Certo! ':'💡 Revise: ')+q.e;$('tFeedback').classList.remove('hidden');$('tNext').classList.remove('hidden')})}$('tNext').onclick=()=>{ti++;if(ti<D.training.length)showT();else{setStage('quiz');showQ()}};function showQ(){let q=D.quiz[qi];$('qCount').textContent='Questão '+(qi+1)+' de 10';$('bar').style.width=((qi+1)*10)+'%';$('qQuestion').textContent=q.q;$('qFeedback').classList.add('hidden');$('qNext').classList.add('hidden');buttons($('qOptions'),q,(j)=>{let ok=j===q.a;if(ok)hits++;tone(ok);$('qOptions').querySelectorAll('button').forEach(b=>b.disabled=true);$('qFeedback').textContent=(ok?'✅ Acertou! ':'💡 Explicação: ')+q.e;$('qFeedback').classList.remove('hidden');$('qNext').classList.remove('hidden')})}$('qNext').onclick=()=>{qi++;if(qi<10)showQ();else finish()};function finish(){setStage('result');let xp=hits*20,coins=hits*10;$('score').textContent=hits+' de 10 acertos';$('message').textContent=hits>=8?'Excelente! Conteúdo bem consolidado.':hits>=6?'Bom trabalho. Vale revisar os erros antes da prova.':'Faça a revisão novamente e refaça a missão.';$('rewards').textContent='⭐ +'+xp+' XP • 🪙 +'+coins+' moedas';let h=[];try{h=JSON.parse(localStorage.getItem('missao-historico')||'[]')}catch(e){}h.push({id:s+'-'+m,title:D.t,subject:root.subject,score:hits,max:10,xp,coins,date:new Date().toISOString().slice(0,10),completedAt:new Date().toISOString()});localStorage.setItem('missao-historico',JSON.stringify(h));localStorage.setItem(s+'-'+m+'-concluida','sim');tone(true)}}$('soundBtn').onclick=()=>{sound=!sound;localStorage.setItem('missao-som',sound?'on':'off');$('soundBtn').textContent=sound?'🔊 Sons':'🔇 Sem sons'};$('soundBtn').textContent=sound?'🔊 Sons':'🔇 Sem sons';</script></body></html>
