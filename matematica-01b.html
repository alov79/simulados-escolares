<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6558d3">
<title>Matemática 01B • Missão Nota 10</title>
<style>
:root{--p:#6558d3;--b:#315f99;--g:#249764;--ink:#24304a;--line:#dce4ef}*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;background:linear-gradient(180deg,#eef3ff,#fafcff);color:var(--ink)}main{max-width:880px;margin:auto;padding:20px}header,.card{background:#fff;border-radius:22px;padding:22px;margin-bottom:16px;box-shadow:0 10px 30px #33447718}header{color:#fff;background:linear-gradient(135deg,var(--b),var(--p))}a{color:inherit}.stats,.row{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#ffffff22;padding:8px 12px;border-radius:99px;font-weight:800}.bar{height:13px;background:#e5e9f3;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6558d3,#9b77ea);transition:.3s}.opt{display:block;border:2px solid #dde3ef;border-radius:14px;padding:13px;margin:9px 0;cursor:pointer}.opt:hover{border-color:var(--p)}button{border:0;border-radius:13px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:var(--p);color:#fff}.help{background:#edf0ff;color:#41368f}.help:disabled{opacity:.45;cursor:not-allowed}.sound{background:#ffffff22;color:#fff}.good{background:#e9f8ef;color:#176b43;padding:12px;border-radius:12px}.bad{background:#fff0f0;color:#96302e;padding:12px;border-radius:12px}.row{margin-top:14px}.hide,[hidden]{display:none!important}#result{text-align:center}.modal{position:fixed;inset:0;background:#17213a99;display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}.modal-box{width:min(420px,96vw);background:#fff;border-radius:24px;padding:26px;text-align:center}.modal-box input{width:100%;padding:14px;border:2px solid #dde3ef;border-radius:14px;font-size:18px;margin:12px 0}.combo{font-weight:900;color:#ffdd72}.medal{font-size:58px}.confetti{position:fixed;top:-20px;font-size:24px;animation:fall 2.8s linear forwards;z-index:999}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}@media(max-width:600px){header h1{font-size:28px}}
</style></head>
<body>
<div class="modal" id="nameModal" hidden><div class="modal-box"><h2>🚀 Quem vai cumprir esta missão?</h2><input id="studentInput" maxlength="30" placeholder="Digite o nome"><p id="nameError" class="bad hide">Digite um nome para continuar.</p><button class="primary" id="startButton">Começar</button></div></div>
<main>
<header><a href="index.html">← Portal</a><h1 id="title">➕ Matemática 01B</h1><p>25 questões inéditas • nível 4º ano • prêmio máximo R$ 5,00</p><div class="stats"><span class="pill" id="pos">1/25</span><span class="pill" id="money">R$ 0,00</span><span class="pill" id="xp">0 XP</span><span class="pill combo" id="combo">🔥 Combo 0</span><button class="sound" id="soundToggle">🔊 Testar som</button></div></header>
<section class="card" id="game"><div class="bar"><i id="prog"></i></div><h2 id="question"></h2><div id="options"></div><div class="row"><button class="help" id="helpHint">🤖 Assistente</button><button class="help" id="helpStudents">🎓 Universitários</button><button class="help" id="helpCards">🃏 Eliminar 2</button></div><p id="note"></p><div class="row"><button class="primary" id="confirm">Confirmar</button><button class="primary hide" id="next">Próxima</button></div></section>
<section class="card hide" id="result"><div class="medal" id="medal">🏅</div><h1>Missão concluída!</h1><h2 id="final"></h2><p id="msg"></p><p><b id="league"></b></p><button class="primary" id="restart">Refazer missão</button> <a href="index.html"><button>Voltar ao portal</button></a></section>
</main>
<script>
const Q=[
['Uma papelaria vendeu 278 cadernos pela manhã e 346 à tarde. Quantos vendeu ao todo?',['614','624','634','644'],1,'278 + 346 = 624.'],
['Calcule 459 + 387.',['836','846','856','866'],1,'459 + 387 = 846.'],
['Uma campanha arrecadou 1.245 kg de alimentos e depois mais 678 kg. Total?',['1.813','1.823','1.923','2.023'],2,'1.245 + 678 = 1.923.'],
['Em uma escola há 638 meninas e 597 meninos. Quantos estudantes há?',['1.225','1.235','1.245','1.255'],1,'638 + 597 = 1.235.'],
['Qual é o resultado de 2.306 + 895?',['3.101','3.191','3.201','3.211'],2,'2.306 + 895 = 3.201.'],
['Uma loja tinha 825 brinquedos e vendeu 469. Quantos restaram?',['346','356','366','376'],1,'825 − 469 = 356.'],
['Pedro tinha R$ 500,00 e gastou R$ 287,00. Quanto sobrou?',['R$ 203,00','R$ 213,00','R$ 223,00','R$ 233,00'],1,'500 − 287 = 213.'],
['A distância total é 1.200 km. Já foram percorridos 735 km. Quantos faltam?',['455','465','475','485'],1,'1.200 − 735 = 465.'],
['Qual é a diferença entre 963 e 578?',['375','385','395','405'],1,'963 − 578 = 385.'],
['Um cinema tem 750 lugares. Se 486 estão ocupados, quantos estão livres?',['254','264','274','284'],1,'750 − 486 = 264.'],
['Cada caixa possui 14 livros. Quantos livros há em 6 caixas?',['74','84','94','104'],1,'14 × 6 = 84.'],
['Uma semana tem 7 dias. Quantos dias há em 8 semanas?',['48','54','56','64'],2,'7 × 8 = 56.'],
['Uma professora organizou 9 grupos com 12 alunos. Quantos alunos participaram?',['98','108','118','128'],1,'9 × 12 = 108.'],
['Quanto é 16 × 5?',['70','75','80','85'],2,'16 × 5 = 80.'],
['Uma caixa contém 24 garrafas. Quantas garrafas há em 4 caixas?',['86','92','96','104'],2,'24 × 4 = 96.'],
['Tabela de pontos: Ana 18, Bia 25, Caio 21, Duda 27. Quem fez mais pontos?',['Ana','Bia','Caio','Duda'],3,'Duda fez 27 pontos.'],
['Na mesma tabela, quantos pontos Bia fez a mais que Ana?',['5','6','7','8'],2,'25 − 18 = 7.'],
['Livros lidos: segunda 12, terça 15, quarta 9, quinta 18. Total dos quatro dias?',['44','49','54','59'],2,'12 + 15 + 9 + 18 = 54.'],
['Frutas vendidas: maçã 35, banana 28, laranja 42. Qual foi a menos vendida?',['Maçã','Banana','Laranja','Todas iguais'],1,'Banana teve 28, o menor valor.'],
['Temperaturas: seg 24°C, ter 27°C, qua 25°C, qui 29°C. Diferença entre quinta e segunda?',['3°C','4°C','5°C','6°C'],2,'29 − 24 = 5°C.'],
['Uma escola comprou 8 caixas com 25 lápis e distribuiu 136. Quantos lápis sobraram?',['54','64','74','84'],1,'8 × 25 = 200; 200 − 136 = 64.'],
['Marina tinha R$ 350,00. Comprou 3 jogos de R$ 65,00. Quanto restou?',['R$ 145,00','R$ 155,00','R$ 165,00','R$ 175,00'],1,'3 × 65 = 195; 350 − 195 = 155.'],
['Um ônibus fez 4 viagens levando 38 passageiros em cada uma. Depois levou mais 17. Total?',['159','169','179','189'],1,'4 × 38 = 152; 152 + 17 = 169.'],
['Uma biblioteca possuía 1.500 livros, recebeu 275 e emprestou 438. Quantos ficaram?',['1.327','1.337','1.347','1.357'],1,'1.500 + 275 − 438 = 1.337.'],
['Para uma festa foram montadas 12 mesas com 8 lugares. Chegaram 79 pessoas. Quantos lugares ficaram vazios?',['15','17','19','21'],1,'12 × 8 = 96; 96 − 79 = 17.']];
const K='missao-mat-01b-v1',NAME='missao-aluno',SOUND='missao-som',HISTORY='missao-historico';
const $=id=>document.getElementById(id);let s=JSON.parse(localStorage.getItem(K)||'null')||{i:0,score:0,combo:0,best:0,done:false,helps:{hint:false,students:false,cards:false}};let locked=false,soundOn=localStorage.getItem(SOUND)!=='off',ctx=null;
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const save=()=>localStorage.setItem(K,JSON.stringify(s));
function audio(){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;if(!ctx)ctx=new A();if(ctx.state==='suspended')ctx.resume();return ctx}function tone(f,d=.15,t='sine',delay=0){const a=audio();if(!soundOn||!a)return;const o=a.createOscillator(),g=a.createGain(),st=a.currentTime+delay;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.16,st);g.gain.exponentialRampToValueAtTime(.001,st+d);o.connect(g);g.connect(a.destination);o.start(st);o.stop(st+d)}function sound(n){if(n==='ok'){tone(523);tone(659,.16,'sine',.1);tone(784,.2,'sine',.2)}else if(n==='bad'){tone(210,.2,'square');tone(160,.25,'square',.15)}else{tone(440);tone(660,.2,'sine',.12)}}
function showModal(){$('nameModal').hidden=false}function hideModal(){$('nameModal').hidden=true}function student(){return(localStorage.getItem(NAME)||'').trim()}function applyName(){const n=student();if(!n){showModal();return false}hideModal();$('title').textContent=`➕ Matemática 01B de ${n}`;return true}
function start(){const n=$('studentInput').value.trim();if(!n){$('nameError').classList.remove('hide');return}localStorage.setItem(NAME,n);hideModal();render();sound('start')}
function render(){if(!applyName())return;if(s.done){finish();return}const q=Q[s.i];$('pos').textContent=`Questão ${s.i+1}/25`;$('money').textContent=brl(s.score/25*5);$('xp').textContent=`${s.score*20+s.best*5} XP`;$('combo').textContent=`🔥 Combo ${s.combo}`;$('prog').style.width=`${s.i/25*100}%`;$('question').textContent=q[0];$('options').innerHTML=q[1].map((o,i)=>`<label class="opt"><input type="radio" name="o" value="${i}"> ${String.fromCharCode(65+i)}. ${o}</label>`).join('');$('note').className='';$('note').textContent='';$('confirm').classList.remove('hide');$('next').classList.add('hide');locked=false;Object.keys(s.helps).forEach(k=>$(k==='hint'?'helpHint':k==='students'?'helpStudents':'helpCards').disabled=s.helps[k])}
function check(){audio();if(locked)return;const e=document.querySelector('input[name=o]:checked');if(!e){$('note').className='bad';$('note').textContent='Escolha uma alternativa.';return}locked=true;const q=Q[s.i],ok=+e.value===q[2];if(ok){s.score++;s.combo++;s.best=Math.max(s.best,s.combo);sound('ok')}else{s.combo=0;sound('bad')}$('note').className=ok?'good':'bad';$('note').textContent=(ok?'🎉 Acertou! ':'💡 Quase! ')+q[3];$('confirm').classList.add('hide');$('next').classList.remove('hide');save();$('combo').textContent=`🔥 Combo ${s.combo}`}
function next(){if(s.i<24){s.i++;save();render()}else{s.done=true;save();record();finish()}}
function record(){let h=JSON.parse(localStorage.getItem(HISTORY)||'[]');h.push({date:new Date().toISOString().slice(0,10),subject:'Matemática',mission:'01B',score:s.score,xp:s.score*20+s.best*5});localStorage.setItem(HISTORY,JSON.stringify(h));localStorage.setItem('missao-ultimo-estudo',new Date().toISOString().slice(0,10))}
function finish(){$('game').classList.add('hide');$('result').classList.remove('hide');$('final').textContent=`${s.score} de 25 • ${brl(s.score/25*5)} • melhor combo ${s.best}`;let medal=s.score===25?'💎':s.score>=22?'🥇':s.score>=18?'🥈':'🥉';$('medal').textContent=medal;$('msg').textContent=s.score>=20?'Excelente desempenho! A missão 01B foi dominada.':'Bom esforço! Revise as explicações e tente melhorar sua pontuação.';const xp=s.score*20+s.best*5;$('league').textContent=xp>=500?'Liga Diamante':xp>=400?'Liga Ouro':xp>=300?'Liga Prata':'Liga Bronze';if(s.score>=20)confetti()}
function confetti(){for(let i=0;i<35;i++){const e=document.createElement('span');e.className='confetti';e.textContent=['🎉','⭐','🟣','🟢'][i%4];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3800)}}
function help(type,text){if(s.helps[type])return;s.helps[type]=true;save();$('note').className='good';$('note').textContent=text;renderHelp()}function renderHelp(){$('helpHint').disabled=s.helps.hint;$('helpStudents').disabled=s.helps.students;$('helpCards').disabled=s.helps.cards}
$('helpHint').onclick=()=>help('hint','🤖 Identifique primeiro o que a pergunta pede e resolva uma etapa de cada vez.');$('helpStudents').onclick=()=>{const c=Q[s.i][2],v=[10,12,14,9];v[c]=65;help('students','🎓 Votação: '+v.map((x,i)=>String.fromCharCode(65+i)+' '+x+'%').join(' • '))};$('helpCards').onclick=()=>{if(s.helps.cards)return;s.helps.cards=true;const c=Q[s.i][2];[0,1,2,3].filter(i=>i!==c).slice(0,2).forEach(i=>{const x=document.querySelector(`input[value="${i}"]`);x.disabled=true;x.closest('label').style.opacity=.35});save();renderHelp()};
$('startButton').onclick=start;$('studentInput').onkeydown=e=>{if(e.key==='Enter')start()};$('confirm').onclick=check;$('next').onclick=next;$('restart').onclick=()=>{localStorage.removeItem(K);location.reload()};$('soundToggle').onclick=()=>{soundOn=true;localStorage.setItem(SOUND,'on');sound('start')};document.addEventListener('pointerdown',audio,{once:true});applyName();render();
</script></body></html>
