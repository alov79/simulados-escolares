<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Perfil • Missão Nota 10</title><style>:root{--p:#6255cf;--b:#315f99;--ink:#263246;--line:#dce4ef}*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;background:#f3f6ff;color:var(--ink)}main{width:min(900px,94vw);margin:auto;padding:22px}.hero,.card{border-radius:22px;padding:22px;margin-bottom:16px}.hero{background:linear-gradient(135deg,var(--b),var(--p));color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.card{background:#fff;border:1px solid var(--line);box-shadow:0 10px 28px #53648f14}.stat{border-radius:16px;padding:14px}.stat b{display:block;font-size:24px}.btn{display:inline-block;background:var(--p);color:#fff;text-decoration:none;padding:11px 15px;border-radius:13px;font-weight:900}.history{display:grid;gap:10px}.item{display:flex;justify-content:space-between;gap:12px;border:1px solid var(--line);padding:13px;border-radius:15px}.bar{height:14px;background:#e6eaf2;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6558d3,#a076e8)}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.item{flex-direction:column}}</style></head><body><main><section class="hero"><a href="index.html" style="color:#fff">← Portal</a><h1>👤 Perfil de <span id="name">Aluno</span></h1><p>Acompanhe sua evolução nas missões.</p></section><section class="grid"><div class="stat">⭐ XP<b id="xp">0</b></div><div class="stat">🪙 Moedas<b id="coins">0</b></div><div class="stat">🏅 Medalhas<b id="medals">0</b></div><div class="stat">🔥 Sequência<b id="streak">0</b></div></section><section class="card"><h2>🏆 Liga atual</h2><h1 id="league">Bronze</h1><div class="bar"><i id="bar" style="width:0%"></i></div><p id="nextLeague"></p></section><section class="card"><h2>📚 Histórico recente</h2><div class="history" id="history"></div></section><section class="card"><h2>🎯 Próxima missão</h2><p>Continue a trilha com Matemática 01B.</p><a class="btn" href="matematica-01b.html">Começar agora</a></section></main><script>const NAME='missao-aluno',HISTORY='missao-historico';const $=id=>document.getElementById(id);const h=JSON.parse(localStorage.getItem(HISTORY)||'[]');$('name').textContent=localStorage.getItem(NAME)||'Aluno';const xp=h.reduce((a,x)=>a+(x.xp||0),0),coins=Math.floor(xp/2),medals=h.filter(x=>x.score>=20).length;$('xp').textContent=xp;$('coins').textContent=coins;$('medals').textContent=medals;const days=[...new Set(h.map(x=>x.date))].sort();let streak=0;if(days.length){let d=new Date();for(let i=0;i<60;i++){const key=d.toISOString().slice(0,10);if(days.includes(key)){streak++;d.setDate(d.getDate()-1)}else if(i===0)d.setDate(d.getDate()-1);else break}}$('streak').textContent=streak+' dia'+(streak===1?'':'s');const levels=[['Bronze',0],['Prata',300],['Ouro',700],['Platina',1200],['Diamante',1800],['Lendário',2500]];let current=levels[0],next=levels[1];for(let i=0;i<levels.length;i++){if(xp>=levels[i][1]){current=levels[i];next=levels[i+1]||null}}$('league').textContent='Liga '+current[0];if(next){const pct=Math.max(0,Math.min(100,(xp-current[1])/(next[1]-current[1])*100));$('bar').style.width=pct+'%';$('nextLeague').textContent=`Faltam ${next[1]-xp} XP para a Liga ${next[0]}.`}else{$('bar').style.width='100%';$('nextLeague').textContent='Você alcançou a liga máxima!'}const box=$('history');if(!h.length)box.innerHTML='<p>Nenhuma missão concluída ainda.</p>';else h.slice().reverse().slice(0,10).forEach(x=>{const e=document.createElement('div');e.className='item';e.innerHTML=`<div><b>${x.subject} ${x.mission}</b><br><small>${x.date}</small></div><div><b>${x.score}/25</b> • ${x.xp||0} XP</div>`;box.appendChild(e)});</script></body></html>
