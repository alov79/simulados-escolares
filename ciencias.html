<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ciências • Missão Nota 10</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eefaf4;color:#24304a}main{max-width:850px;margin:auto;padding:20px}header,.card{background:#fff;border-radius:22px;padding:22px;margin-bottom:16px;box-shadow:0 10px 30px #33447718}header{color:#fff;background:linear-gradient(135deg,#16845b,#43a76f)}a{color:inherit}.stats,.row{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#ffffff22;padding:8px 12px;border-radius:99px}.bar{height:12px;background:#e5eee9;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#2e9d68}.opt{display:block;border:2px solid #d9e9df;border-radius:14px;padding:13px;margin:9px 0;cursor:pointer}.opt:hover{border-color:#2e9d68}button{border:0;border-radius:13px;padding:12px 16px;font-weight:700;cursor:pointer}.primary{background:#2e9d68;color:#fff}.help{background:#e9f8ef;color:#176b43}.help:disabled{opacity:.45;cursor:not-allowed;text-decoration:line-through}.sound{background:#ffffff22;color:#fff}.good{background:#e9f8ef;color:#176b43;padding:12px;border-radius:12px}.bad{background:#fff0f0;color:#96302e;padding:12px;border-radius:12px}.row{margin-top:14px}.hide,[hidden]{display:none!important}#result{text-align:center}.modal{position:fixed;inset:0;background:#17213a99;display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}.modal-box{width:min(420px,96vw);background:#fff;border-radius:24px;padding:26px;text-align:center}.modal-box input{width:100%;padding:14px;border:2px solid #d9e9df;border-radius:14px;font-size:18px;margin:12px 0}.error{color:#a12d2d;font-weight:700}@media(max-width:600px){header h1{font-size:28px}}</style></head><body><div class="modal" id="nameModal" hidden aria-hidden="true"><div class="modal-box"><h2>🔬 Quem vai fazer a missão?</h2><p>Digite o nome apenas para identificar o aluno.</p><input id="studentInput" maxlength="30" placeholder="Digite o nome" autocomplete="name"><p id="nameError" class="error hide">Digite um nome para continuar.</p><button type="button" class="primary" id="startButton">Começar o simulado</button></div></div><main><header><a href="index.html">← Portal</a><h1 id="title">🔬 Desafio de Ciências</h1><p>25 questões • misturas e separação de misturas</p><div class="stats"><span class="pill" id="pos">Questão 1/25</span><span class="pill" id="money">R$ 0,00</span><span class="pill" id="xp">0 XP</span><button class="sound" id="soundToggle" type="button">🔊 Testar som</button></div></header><section class="card" id="game"><div class="bar"><i id="prog" style="width:0"></i></div><h2 id="question"></h2><div id="options"></div><div class="row"><button id="helpHint" class="help">🤖 Assistente (1 uso)</button><button id="helpStudents" class="help">🎓 Universitários (1 uso)</button><button id="helpCards" class="help">🃏 Eliminar 2 (1 uso)</button></div><p id="note"></p><div class="row"><button class="primary" id="confirm">Confirmar</button><button class="primary hide" id="next">Próxima</button></div></section><section class="card hide" id="result"><h1>🏆 Missão concluída!</h1><h2 id="final"></h2><p id="msg"></p><button class="primary" id="restart">Jogar novamente</button></section></main><script>const Q=[['O que é uma mistura?',['Uma única substância pura','A união de duas ou mais substâncias','Somente água com açúcar','Apenas materiais sólidos'],1,'Mistura é a união de duas ou mais substâncias.'],['Água com sal, depois de mexida, forma uma mistura:',['Heterogênea','Homogênea','Gasosa','Impossível'],1,'O sal se dissolve e a mistura fica com aspecto uniforme.'],['Água e óleo formam uma mistura:',['Homogênea','Heterogênea','Pura','Gasosa'],1,'É possível perceber duas fases: água e óleo.'],['Em uma mistura homogênea, nós observamos:',['Uma única fase','Sempre duas fases','Somente sólidos','Nenhuma substância'],0,'Misturas homogêneas apresentam aspecto uniforme e uma fase visível.'],['Qual exemplo é heterogêneo?',['Água com sal dissolvido','Ar','Água e areia','Vinagre'],2,'Na água com areia, os componentes podem ser percebidos.'],['Qual processo separa feijão de pequenas pedras?',['Filtração','Catação','Evaporação','Decantação'],1,'A catação é feita manualmente, retirando materiais diferentes.'],['Uma peneira separa materiais principalmente pelo:',['Cheiro','Tamanho das partículas','Sabor','Estado líquido'],1,'A peneiração usa a diferença de tamanho das partículas.'],['Para separar areia da água usando papel de filtro, usamos:',['Filtração','Imantação','Catação','Destilação'],0,'O filtro retém a areia e deixa a água passar.'],['Deixar barro e água em repouso para o barro se depositar é:',['Evaporação','Decantação','Peneiração','Imantação'],1,'Na decantação, o material mais denso se deposita.'],['Qual método usa um ímã?',['Filtração','Imantação','Evaporação','Catação'],1,'A imantação separa materiais atraídos pelo ímã.'],['Para obter sal da água do mar, pode-se usar:',['Evaporação','Catação','Peneiração','Imantação'],0,'A água evapora e o sal permanece.'],['Ao coar café, ocorre principalmente:',['Filtração','Decantação','Imantação','Evaporação'],0,'O filtro retém o pó e permite a passagem do líquido.'],['Misturar água e açúcar e mexer bastante produz:',['Duas fases visíveis','Uma mistura homogênea','Uma substância pura','Uma mistura impossível'],1,'O açúcar dissolvido deixa a mistura uniforme.'],['Qual mistura tem mais de uma fase visível?',['Água mineral','Água com areia','Vinagre','Álcool e água'],1,'A areia pode ser vista separada da água.'],['Separar grãos maiores dos menores com uma peneira é:',['Peneiração','Decantação','Evaporação','Filtração'],0,'A peneira separa partículas de tamanhos diferentes.'],['O ar é considerado:',['Uma substância única','Uma mistura de gases','Uma mistura apenas líquida','Um sólido'],1,'O ar é formado por diferentes gases.'],['Qual método é adequado para separar limalha de ferro e areia?',['Imantação','Evaporação','Decantação','Catação líquida'],0,'O ímã atrai a limalha de ferro.'],['Quando o líquido passa pelo filtro, ele é chamado de:',['Resíduo','Filtrado','Ímã','Fase sólida'],1,'Filtrado é o líquido que atravessa o filtro.'],['O material que fica retido no filtro é chamado de:',['Filtrado','Resíduo','Vapor','Solução'],1,'O resíduo permanece no filtro.'],['Qual situação mostra decantação?',['Escolher pedras do arroz','Coar suco','Deixar água barrenta parada','Usar ímã'],2,'A parte sólida se deposita no fundo quando fica em repouso.'],['Água e álcool, quando misturados, geralmente formam:',['Mistura homogênea','Mistura heterogênea','Duas camadas visíveis','Somente um sólido'],0,'Água e álcool se misturam de modo uniforme.'],['Qual opção contém apenas métodos de separação?',['Filtração, catação e peneiração','Fusão, cor e cheiro','Mistura, solução e fase','Sólido, líquido e gás'],0,'Os três são métodos usados para separar componentes.'],['Antes de escolher um método de separação, devemos observar:',['As propriedades dos materiais','Somente a cor','Apenas o nome da mistura','O preço dos materiais'],0,'Tamanho, densidade, magnetismo e solubilidade ajudam na escolha.'],['Uma mistura de água, areia e pedrinhas pode ser separada primeiro por:',['Peneiração para retirar as pedras','Evaporação imediata','Imantação da água','Catação do líquido'],0,'A peneira pode retirar primeiro as partículas maiores.'],['Por que não usamos catação para separar sal dissolvido na água?',['Porque o sal não está visível em grãos separáveis','Porque a água é sólida','Porque o sal é magnético','Porque a mistura tem pedras'],0,'O sal dissolvido não pode ser retirado manualmente.']];const K='missao-ciencias-v1',NAME_KEY='missao-aluno',SOUND_KEY='missao-som';const $=id=>document.getElementById(id);let s=JSON.parse(localStorage.getItem(K)||'null')||{i:0,score:0,ans:[],done:false,helps:{hint:false,students:false,cards:false}};if(!s.helps)s.helps={hint:false,students:false,cards:false};let locked=false,soundOn=localStorage.getItem(SOUND_KEY)!=='off',audioCtx=null;const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function save(){localStorage.setItem(K,JSON.stringify(s))}function openModal(){$('nameModal').hidden=false;$('nameModal').style.display='flex';$('nameModal').setAttribute('aria-hidden','false');setTimeout(()=>$('studentInput').focus(),50)}function closeModal(){$('nameModal').hidden=true;$('nameModal').style.display='none';$('nameModal').setAttribute('aria-hidden','true')}async function unlockAudio(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')await audioCtx.resume();return audioCtx}function tone(freq,duration=.12,type='sine',delay=0,volume=.12){if(!soundOn||!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),start=audioCtx.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,start);g.gain.setValueAtTime(volume,start);g.gain.exponentialRampToValueAtTime(.001,start+duration);o.connect(g);g.connect(audioCtx.destination);o.start(start);o.stop(start+duration)}function play(name){if(!soundOn||!audioCtx)return;if(name==='correct'){tone(523);tone(659,.14,'sine',.1);tone(784,.18,'sine',.2)}else if(name==='wrong'){tone(220,.18,'sawtooth');tone(180,.22,'sawtooth',.13)}else if(name==='next'){tone(440,.07);tone(554,.09,'sine',.06)}else if(name==='help'){tone(660,.08,'triangle');tone(880,.12,'triangle',.08)}else if(name==='finish'){[523,659,784,1047].forEach((f,i)=>tone(f,.22,'sine',i*.12,.14))}else{tone(392,.1);tone(523,.13,'sine',.09)}}async function testSound(){await unlockAudio();soundOn=true;localStorage.setItem(SOUND_KEY,'on');$('soundToggle').textContent='🔊 Som ligado';play('start')}function getStudent(){return(localStorage.getItem(NAME_KEY)||'').trim()}function applyStudent(){const n=getStudent();if(!n)return false;closeModal();$('title').textContent=`🔬 Desafio de Ciências de ${n}`;return true}async function saveStudent(){const n=$('studentInput').value.trim();if(!n){$('nameError').classList.remove('hide');return}$('nameError').classList.add('hide');localStorage.setItem(NAME_KEY,n);closeModal();$('title').textContent=`🔬 Desafio de Ciências de ${n}`;await unlockAudio();play('start');render()}function updateHelpButtons(){$('helpHint').disabled=s.helps.hint;$('helpStudents').disabled=s.helps.students;$('helpCards').disabled=s.helps.cards}function render(){if(!applyStudent()){openModal();return}const q=Q[s.i];$('game').classList.remove('hide');$('result').classList.add('hide');$('pos').textContent=`Questão ${s.i+1}/25`;$('money').textContent=brl(s.score/25*5);$('xp').textContent=s.score*20+' XP';$('prog').style.width=(s.i/25*100)+'%';$('question').textContent=q[0];$('options').innerHTML=q[1].map((o,i)=>`<label class="opt"><input type="radio" name="o" value="${i}"> ${String.fromCharCode(65+i)}. ${o}</label>`).join('');$('note').className='';$('note').textContent='';$('confirm').classList.remove('hide');$('next').classList.add('hide');locked=false;updateHelpButtons()}async function check(){await unlockAudio();if(locked)return;const e=document.querySelector('input[name=o]:checked');if(!e){$('note').className='bad';$('note').textContent='Escolha uma alternativa.';play('wrong');return}locked=true;const q=Q[s.i],ok=Number(e.value)===q[2];if(ok)s.score++;s.ans[s.i]=ok;$('note').className=ok?'good':'bad';$('note').textContent=(ok?'🎉 Acertou! ':'💡 Quase! ')+q[3];$('confirm').classList.add('hide');$('next').classList.remove('hide');save();play(ok?'correct':'wrong')}function next(){play('next');if(s.i<Q.length-1){s.i++;save();setTimeout(render,80)}else{s.done=true;save();setTimeout(finish,100)}}function finish(){closeModal();$('game').classList.add('hide');$('result').classList.remove('hide');$('final').textContent=`${s.score} de 25 • ${brl(s.score/25*5)}`;$('msg').textContent=s.score>=20?'Excelente! Você dominou o conteúdo.':s.score>=15?'Bom trabalho! Revise os erros e tente novamente.':'Continue estudando. Cada tentativa ajuda a aprender.';play('finish')}function useHelp(type,text){if(s.helps[type])return;s.helps[type]=true;save();updateHelpButtons();$('note').className='good';$('note').textContent=text;play('help')}function hint(){useHelp('hint','🤖 Pense nas propriedades dos materiais: tamanho, densidade, solubilidade e magnetismo.')}function students(){const c=Q[s.i][2],v=[9,12,14,8];v[c]=70;useHelp('students','🎓 Votação: '+v.map((x,i)=>String.fromCharCode(65+i)+' '+x+'%').join(' • '))}function cards(){if(s.helps.cards)return;s.helps.cards=true;const c=Q[s.i][2],w=[0,1,2,3].filter(i=>i!==c).slice(0,2);w.forEach(i=>{const e=document.querySelector(`input[value="${i}"]`);if(e){e.disabled=true;e.closest('label').style.opacity=.35}});save();updateHelpButtons();$('note').className='good';$('note').textContent='🃏 Duas alternativas incorretas foram eliminadas.';play('help')}function restart(){localStorage.removeItem(K);location.reload()}$('startButton').addEventListener('click',saveStudent);$('studentInput').addEventListener('keydown',e=>{if(e.key==='Enter')saveStudent()});$('confirm').addEventListener('click',check);$('next').addEventListener('click',next);$('helpHint').addEventListener('click',hint);$('helpStudents').addEventListener('click',students);$('helpCards').addEventListener('click',cards);$('restart').addEventListener('click',restart);$('soundToggle').addEventListener('click',testSound);if(applyStudent()){if(s.done)finish();else render()}else openModal();</script></body></html>
