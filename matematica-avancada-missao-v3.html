<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="assets/v2.css"><title>Desafio Avançado • Matemática</title><style>.hidden{display:none!important}.opt{display:block;width:100%;text-align:left;padding:14px;margin:9px 0;border:1px solid #ddd;border-radius:14px;background:#fff;font:inherit}.question{font-size:1.17rem;font-weight:850;line-height:1.5}.feedback{padding:14px;background:#f4f2ff;border-radius:15px;margin:12px 0}.visual{padding:16px;margin:14px 0;background:#fbfaff;border:1px solid #e6e2ff;border-radius:18px;overflow:auto}.tbl{width:100%;border-collapse:collapse;min-width:390px}.tbl th,.tbl td{padding:9px;border:1px solid #d9d6e8;text-align:center}.bars{height:190px;display:flex;align-items:end;gap:12px;padding:15px 10px 32px;border-left:2px solid #777;border-bottom:2px solid #777}.bar{flex:1;background:#8378df;border-radius:7px 7px 0 0;position:relative;min-width:30px}.bar b{position:absolute;top:-23px;width:100%;text-align:center;font-size:12px}.bar span{position:absolute;bottom:-27px;width:100%;text-align:center;font-size:11px}.pict{font-size:26px;line-height:1.8;letter-spacing:4px}.jugs{display:flex;gap:12px;flex-wrap:wrap}.jug{padding:18px 14px;border:3px solid #8f84e8;border-top:0;border-radius:5px 5px 16px 16px;min-width:90px;text-align:center;font-weight:900;background:linear-gradient(to top,#dff4ff 55%,transparent 55%)}.hint{font-size:13px;color:#666}</style></head><body><main class="shell"><header class="topbar"><a class="brand" href="matematica-desafio-avancado-v3.html">← Desafio Avançado</a><nav class="nav"><button id="sound">🔊 Sons</button></nav></header><section class="mission-hero"><span class="badge orange" id="badge"></span><h1 id="title"></h1><p id="desc"></p></section><section class="section card"><div class="progress"><i id="bar" style="width:10%"></i></div><p class="small" id="count"></p><div id="visual"></div><p class="question" id="question"></p><div id="options"></div><div class="feedback hidden" id="feedback"></div><button class="btn hidden" id="next">Próxima questão</button></section><section class="section card hidden" id="result"><h1>🏆 Missão concluída!</h1><p id="score"></p><h2 id="reward"></h2><a class="btn" href="matematica-desafio-avancado-v3.html">Escolher outra missão</a></section></main><script>const none='';function table(headers,rows){return '<div class="visual"><table class="tbl"><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</table></div>'}function bars(labels,vals,title){let mx=Math.max(...vals);return '<div class="visual"><b>'+title+'</b><div class="bars">'+vals.map((v,i)=>'<div class="bar" style="height:'+(v/mx*90)+'%"><b>'+v+'</b><span>'+labels[i]+'</span></div>').join('')+'</div></div>'}function pict(rows,key){return '<div class="visual"><div class="hint">'+key+'</div>'+rows.map(r=>'<p><b>'+r[0]+':</b> <span class="pict">'+r[1]+'</span></p>').join('')+'</div>'}function jugs(items){return '<div class="visual"><div class="jugs">'+items.map(x=>'<div class="jug">'+x+'</div>').join('')+'</div></div>'}const S=[{t:'Problemas em múltiplas etapas',d:'Leia, planeje e só então calcule.',q:[['Uma escola recebeu 864 livros para 8 turmas. Cada turma separou 27 livros para sua biblioteca. Quantos livros restaram em cada turma?',['81','91','108','135'],0,'864 ÷ 8 = 108; 108 − 27 = 81.',none],['Uma fábrica produziu 1.248 garrafas pela manhã e 936 à tarde. Elas serão colocadas em caixas de 24. Quantas caixas completas serão necessárias?',['81','86','91','96'],2,'1.248 + 936 = 2.184; 2.184 ÷ 24 = 91.',none],['Uma excursão custa R$ 38 por aluno. 27 alunos participarão e a turma já arrecadou R$ 750. Quanto ainda falta?',['R$ 256','R$ 266','R$ 276','R$ 286'],2,'38 × 27 = 1.026; 1.026 − 750 = 276.',none],['Uma biblioteca tinha 1.560 livros. Recebeu 385 novos e depois emprestou 728. Quantos ficaram disponíveis?',['1.117','1.207','1.217','1.227'],2,'1.560 + 385 = 1.945; 1.945 − 728 = 1.217.',none],['Em um campeonato, 18 equipes têm 14 jogadores cada. Se 37 jogadores faltaram, quantos compareceram?',['205','215','225','235'],1,'18 × 14 = 252; 252 − 37 = 215.',none],['Uma papelaria recebeu 35 caixas com 48 cadernos. Vendeu 975. Quantos cadernos restaram?',['695','705','715','725'],1,'35 × 48 = 1.680; 1.680 − 975 = 705.',none],['Um teatro tem 24 fileiras com 36 lugares. Em uma sessão, 187 lugares ficaram vazios. Quantas pessoas assistiram?',['667','677','687','697'],1,'24 × 36 = 864; 864 − 187 = 677.',none],['Uma escola comprou 15 pacotes com 60 folhas coloridas. Usou 348 na feira e 127 em cartazes. Quantas sobraram?',['415','425','435','445'],1,'15 × 60 = 900; 348 + 127 = 475; 900 − 475 = 425.',none],['Uma loja tinha 2.000 brinquedos. Vendeu 468 na primeira semana e 537 na segunda. Depois recebeu 250 novos. Quantos tem agora?',['1.225','1.235','1.245','1.255'],2,'2.000 − 468 − 537 + 250 = 1.245.',none],['Uma turma juntou 1.440 tampinhas em 12 dias, na mesma quantidade por dia. Nos 4 dias seguintes juntou 25 a mais por dia que a média anterior. Quantas tampinhas juntou nesses 4 dias?',['480','500','560','580'],3,'1.440 ÷ 12 = 120; 120 + 25 = 145; 145 × 4 = 580.',none]]},{t:'Divisão e capacidade',d:'Interprete o resto e combine litros e mililitros.',q:[['Uma escola levará 146 alunos em vans com 12 lugares. Qual é o menor número de vans necessário?',['11','12','13','14'],2,'146 ÷ 12 = 12 com resto 2. É necessária a 13ª van.',none],['Uma festa tem 275 copos de suco. Cada bandeja comporta 24 copos. Quantas bandejas são necessárias para levar todos?',['10','11','12','13'],2,'275 ÷ 24 = 11 bandejas completas e sobra; é necessária a 12ª.',none],['Uma jarra tem 3 L de suco. Foram servidos 7 copos de 250 mL. Quanto restou?',['1 L','1,25 L','1,5 L','1,75 L'],1,'7 × 250 = 1.750 mL; 3.000 − 1.750 = 1.250 mL = 1,25 L.',jugs(['3 L','250 mL × 7'])],['Para encher um recipiente de 5 L usando uma garrafa de 750 mL, quantas garrafas CHEIAS cabem sem ultrapassar 5 L?',['5','6','7','8'],1,'6 × 750 = 4.500 mL; 7 × 750 = 5.250 mL, ultrapassa.',jugs(['5 L','750 mL'])],['Uma caixa contém 18 garrafas de 500 mL. Qual é o volume total?',['8 L','9 L','10 L','18 L'],1,'18 × 500 = 9.000 mL = 9 L.',jugs(['500 mL × 18'])],['Um reservatório tinha 8 L. Foram usados 2,5 L pela manhã e 1.750 mL à tarde. Quanto restou?',['3,25 L','3,5 L','3,75 L','4,25 L'],2,'8.000 − 2.500 − 1.750 = 3.750 mL = 3,75 L.',jugs(['8 L','− 2,5 L','− 1.750 mL'])],['96 garrafas serão distribuídas igualmente em 7 caixas. Quantas ficam em cada caixa e quantas sobram?',['13 e sobram 5','13 e sobram 6','14 e sobram 1','12 e sobram 12'],0,'96 = 7 × 13 + 5.',none],['Uma cantina prepara 12 L de vitamina. Cada copo recebe 300 mL. Quantos copos completos podem ser servidos?',['30','35','40','45'],2,'12 L = 12.000 mL; 12.000 ÷ 300 = 40.',jugs(['12 L','300 mL'])],['Uma família compra 4 garrafas de 1,5 L e 6 garrafas de 500 mL. Qual é o total?',['7 L','8 L','9 L','10 L'],2,'4 × 1,5 L = 6 L; 6 × 500 mL = 3 L; total 9 L.',jugs(['1,5 L × 4','500 mL × 6'])],['Uma caixa-d’água precisa receber 20 L. Já foram colocados 13,5 L. Usando jarras de 500 mL, quantas jarras ainda são necessárias?',['11','12','13','14'],2,'Faltam 6,5 L = 6.500 mL; 6.500 ÷ 500 = 13.',jugs(['20 L','13,5 L','500 mL'])]]},{t:'Laboratório de gráficos e tabelas',d:'Observe os dados visuais, cruze informações e raciocine.',q:[['O gráfico mostra garrafas recolhidas. Quantas garrafas a mais foram recolhidas na quinta do que na terça e quantas caixas de 12 podem ser preenchidas apenas com essa diferença?',['24 e 2 caixas','30 e 2 caixas','36 e 3 caixas','42 e 3 caixas'],2,'84 − 48 = 36; 36 ÷ 12 = 3 caixas.',bars(['SEG','TER','QUA','QUI','SEX'],[36,48,60,84,72],'Campanha de reciclagem — garrafas')],['A tabela mostra alunos e capacidade dos ônibus. Qual passeio precisa de 3 ônibus e ainda deixa MAIS lugares vazios?',['Museu','Parque','Aquário','Museu e Aquário'],0,'Museu: 3×30=90, sobram 16 lugares. Parque: 3×40=120, sobram 24, mas são 96 alunos; Aquário: 3×28=84, sobram 3. Parque deixa 24, então a resposta correta seria Parque.',table(['Passeio','Alunos','Lugares/ônibus'],[['Museu','74','30'],['Parque','96','40'],['Aquário','81','28']])],['Cada ⭐ representa 8 livros lidos. Quantos livros Bia e Caio leram juntos?',['64','72','80','88'],2,'Bia: 4×8=32; Caio: 6×8=48; juntos 80.',pict([['Ana','⭐⭐⭐⭐⭐'],['Bia','⭐⭐⭐⭐'],['Caio','⭐⭐⭐⭐⭐⭐']],'Cada ⭐ = 8 livros')],['Compare a tabela. Qual foi o total vendido de terça a quinta e quanto isso supera segunda-feira?',['150 e supera 120','165 e supera 135','180 e supera 150','195 e supera 165'],1,'Ter+Qua+Qui = 45+60+60=165; 165−30=135.',table(['Dia','Seg','Ter','Qua','Qui'],[['Sorvetes vendidos','30','45','60','60']])],['O gráfico mostra pontos de quatro equipes. Se a equipe Azul ganhar mais 28 pontos, ela ultrapassa qual equipe, mas ainda fica atrás de qual?',['Ultrapassa Verde e fica atrás da Roxa','Ultrapassa Roxa e fica atrás da Verde','Ultrapassa todas','Não ultrapassa nenhuma'],0,'Azul passa de 54 para 82: supera Verde (68) e ainda fica atrás da Roxa (91).',bars(['AZUL','VERDE','ROXA','AMARELA'],[54,68,91,76],'Pontuação das equipes')],['Na tabela, cada caixa comporta 24 produtos. Qual produto precisa de 5 caixas para guardar tudo, considerando que uma caixa parcialmente ocupada também conta?',['A','B','C','B e C'],2,'A: 72=3 caixas; B: 96=4; C: 101 precisa de 5.',table(['Produto','Quantidade'],[['A','72'],['B','96'],['C','101']])],['Cada 🚲 representa 6 bicicletas alugadas. Quantas bicicletas foram alugadas nos três primeiros dias?',['72','78','84','90'],2,'Seg 24 + Ter 30 + Qua 30 = 84.',pict([['Seg','🚲🚲🚲🚲'],['Ter','🚲🚲🚲🚲🚲'],['Qua','🚲🚲🚲🚲🚲'],['Qui','🚲🚲🚲']],'Cada 🚲 = 6 bicicletas')],['A tabela mostra suco preparado e consumido. Em qual turma sobrou mais suco e qual foi a sobra?',['4A, 1 L','4B, 1,5 L','4C, 2 L','4B, 2 L'],1,'4A: 8−7=1 L; 4B: 10−8,5=1,5 L; 4C: 9−8=1 L.',table(['Turma','Preparado','Consumido'],[['4A','8 L','7 L'],['4B','10 L','8,5 L'],['4C','9 L','8 L']])],['O gráfico mostra ingressos vendidos. Se cada ingresso custa R$ 5, qual a diferença de arrecadação entre sábado e quinta?',['R$ 100','R$ 125','R$ 150','R$ 175'],2,'Sábado 90 e quinta 60: diferença 30 ingressos; 30×5=R$150.',bars(['QUA','QUI','SEX','SÁB'],[45,60,75,90],'Ingressos vendidos')],['Cruze os dois dados: a turma 4A tem 32 alunos e cada aluno precisa de 3 garrafas de 500 mL para uma atividade. Quantos litros serão necessários no total?',['24 L','32 L','40 L','48 L'],3,'32×3=96 garrafas; 96×500=48.000 mL=48 L.',table(['Turma','Alunos','Garrafas por aluno'],[['4A','32','3'],['4B','28','2']])]]}];let m=Math.min(3,Math.max(1,Number(new URLSearchParams(location.search).get('m')||1))),D=S[m-1],i=0,hits=0,sound=localStorage.getItem('missao-som')!=='off';const $=x=>document.getElementById(x);$('badge').textContent='MISSÃO '+(m+5)+' • AVANÇADO';$('title').textContent=D.t;$('desc').textContent=D.d;function tone(ok){if(!sound)return;try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=ok?780:220;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.15)}catch(e){}}function show(){let q=D.q[i];$('count').textContent='Questão '+(i+1)+' de 10';$('bar').style.width=((i+1)*10)+'%';$('visual').innerHTML=q[4]||'';$('question').textContent=q[0];$('options').innerHTML=q[1].map((x,j)=>'<button class="opt" data-i="'+j+'">'+String.fromCharCode(65+j)+') '+x+'</button>').join('');$('feedback').classList.add('hidden');$('next').classList.add('hidden');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)))}function answer(j){let q=D.q[i],ok=j===q[2];if(ok)hits++;tone(ok);document.querySelectorAll('.opt').forEach(b=>b.disabled=true);$('feedback').textContent=(ok?'✅ Muito bem! ':'💡 Analise novamente: ')+q[3];$('feedback').classList.remove('hidden');$('next').classList.remove('hidden')}$('next').onclick=()=>{if(++i<10)show();else finish()};$('sound').onclick=()=>{sound=!sound;localStorage.setItem('missao-som',sound?'on':'off');$('sound').textContent=sound?'🔊 Sons':'🔇 Sons'};function finish(){document.querySelector('.section.card:not(#result)').classList.add('hidden');$('result').classList.remove('hidden');let xp=hits*30,coins=hits*15;$('score').textContent='Você acertou '+hits+' de 10 questões avançadas.';$('reward').textContent='⭐ +'+xp+' XP • 🪙 +'+coins+' moedas';let h=[];try{h=JSON.parse(localStorage.getItem('missao-historico')||'[]')}catch(e){}h.push({subject:'Matemática',mission:'Desafio Avançado '+(m+5),score:hits,total:10,xp,coins,date:new Date().toISOString().slice(0,10)});localStorage.setItem('missao-historico',JSON.stringify(h));tone(true)}show();</script></body></html>
